name: Fan-out sync

on:
  workflow_call:
    inputs:
      base_sha:
        description: Diff base. Empty → all types.
        required: false
        type: string
        default: ""
      dry_run:
        required: true
        type: boolean
      vcs_ref:
        description: Template git ref to copy (must exist on the remote).
        required: true
        type: string
      pr_number:
        description: Distributor PR to comment on. Empty → no comment (push).
        required: false
        type: string
        default: ""
    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

jobs:
  read:
    runs-on: ubuntu-24.04
    outputs:
      config: ${{ steps.list.outputs.config }}
      lib: ${{ steps.list.outputs.lib }}
      deployable: ${{ steps.list.outputs.deployable }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.vcs_ref }}

      - name: List targets
        id: list
        uses: ./.github/actions/list-targets
        with:
          base_sha: ${{ inputs.base_sha }}
          vcs_ref: ${{ inputs.vcs_ref }}

  config:
    needs: read
    if: needs.read.outputs.config != '[]'
    name: ${{ inputs.dry_run && format('{0} (dry-run)', matrix.label) || format('{0} sync', matrix.label) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.read.outputs.config) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Sync
        uses: ./.github/actions/sync
        with:
          repo: ${{ matrix.repo }}
          url: ${{ matrix.url }}
          branch: ${{ matrix.branch }}
          type: config
          vcs_ref: ${{ inputs.vcs_ref }}
          dry_run: ${{ inputs.dry_run }}
          sync_type: ${{ matrix.sync_type }}
          automerge: ${{ matrix.automerge }}
          label: ${{ matrix.label }}
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

  lib:
    needs: read
    if: needs.read.outputs.lib != '[]'
    name: ${{ inputs.dry_run && format('{0} (dry-run)', matrix.label) || format('{0} sync', matrix.label) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.read.outputs.lib) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Sync
        uses: ./.github/actions/sync
        with:
          repo: ${{ matrix.repo }}
          url: ${{ matrix.url }}
          branch: ${{ matrix.branch }}
          type: lib
          vcs_ref: ${{ inputs.vcs_ref }}
          dry_run: ${{ inputs.dry_run }}
          sync_type: ${{ matrix.sync_type }}
          automerge: ${{ matrix.automerge }}
          label: ${{ matrix.label }}
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

  deployable:
    needs: read
    if: needs.read.outputs.deployable != '[]'
    name: ${{ inputs.dry_run && format('{0} (dry-run)', matrix.label) || format('{0} sync', matrix.label) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.read.outputs.deployable) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Sync
        uses: ./.github/actions/sync
        with:
          repo: ${{ matrix.repo }}
          url: ${{ matrix.url }}
          branch: ${{ matrix.branch }}
          type: deployable
          vcs_ref: ${{ inputs.vcs_ref }}
          dry_run: ${{ inputs.dry_run }}
          sync_type: ${{ matrix.sync_type }}
          automerge: ${{ matrix.automerge }}
          label: ${{ matrix.label }}
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

  summarize:
    needs: [read, config, lib, deployable]
    if: ${{ !cancelled() && !failure() && inputs.pr_number != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.vcs_ref }}
      - name: Download sync results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: sync-result-*
          path: results
          merge-multiple: true
      - name: Upsert Sync Preview
        uses: ./.github/actions/pr-comment
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          results: results
          pr_number: ${{ inputs.pr_number }}
