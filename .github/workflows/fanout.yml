name: Fan-out sync

on:
  workflow_call:
    inputs:
      base_sha:
        description: Diff base. Empty → all types.
        required: false
        type: string
        default: ""
      dry_run:
        required: true
        type: boolean
      execute_gh:
        required: false
        type: boolean
        default: false
      vcs_ref:
        description: Template git ref to copy (must exist on the remote).
        required: true
        type: string
      pr_number:
        description: Distributor PR to comment on. Empty → no comment (push).
        required: false
        type: string
        default: ""
    secrets:
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false

jobs:
  read:
    runs-on: ubuntu-24.04
    outputs:
      config: ${{ steps.list.outputs.config }}
      lib: ${{ steps.list.outputs.lib }}
      deployable: ${{ steps.list.outputs.deployable }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.vcs_ref }}

      - id: types
        run: |
          if [ -z "${{ inputs.base_sha }}" ]; then
            echo "types=config,lib,deployable" >> "$GITHUB_OUTPUT"
            echo "no base sha; all types"
            exit 0
          fi
          types=$(python3 scripts/affected_types.py "${{ inputs.base_sha }}" "${{ inputs.vcs_ref }}")
          echo "types=$types" >> "$GITHUB_OUTPUT"
          echo "affected types: ${types:-<none>}"

      - id: list
        run: python3 scripts/list_targets.py "${{ steps.types.outputs.types }}"

  config:
    needs: read
    if: needs.read.outputs.config != '[]'
    name: ${{ inputs.dry_run && format('{0} (dry-run)', matrix.label) || format('{0} sync', matrix.label) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.read.outputs.config) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sync
        with:
          repo: ${{ matrix.repo }}
          url: ${{ matrix.url }}
          branch: ${{ matrix.branch }}
          type: config
          slack: ${{ matrix.slack }}
          vcs_ref: ${{ inputs.vcs_ref }}
          dry_run: ${{ inputs.dry_run }}
          execute_gh: ${{ inputs.execute_gh }}
          sync_type: ${{ matrix.sync_type }}
          automerge: ${{ matrix.automerge }}
          label: ${{ matrix.label }}
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

  lib:
    needs: read
    if: needs.read.outputs.lib != '[]'
    name: ${{ inputs.dry_run && format('{0} (dry-run)', matrix.label) || format('{0} sync', matrix.label) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.read.outputs.lib) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sync
        with:
          repo: ${{ matrix.repo }}
          url: ${{ matrix.url }}
          branch: ${{ matrix.branch }}
          type: lib
          slack: ${{ matrix.slack }}
          vcs_ref: ${{ inputs.vcs_ref }}
          dry_run: ${{ inputs.dry_run }}
          execute_gh: ${{ inputs.execute_gh }}
          sync_type: ${{ matrix.sync_type }}
          automerge: ${{ matrix.automerge }}
          label: ${{ matrix.label }}
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

  deployable:
    needs: read
    if: needs.read.outputs.deployable != '[]'
    name: ${{ inputs.dry_run && format('{0} (dry-run)', matrix.label) || format('{0} sync', matrix.label) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.read.outputs.deployable) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sync
        with:
          repo: ${{ matrix.repo }}
          url: ${{ matrix.url }}
          branch: ${{ matrix.branch }}
          type: deployable
          slack: ${{ matrix.slack }}
          vcs_ref: ${{ inputs.vcs_ref }}
          dry_run: ${{ inputs.dry_run }}
          execute_gh: ${{ inputs.execute_gh }}
          sync_type: ${{ matrix.sync_type }}
          automerge: ${{ matrix.automerge }}
          label: ${{ matrix.label }}
          app_id: ${{ secrets.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}

  summarize:
    needs: [config, lib, deployable]
    if: always() && inputs.pr_number != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.vcs_ref }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: sync-result-*
          path: results
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/fanout_pr_comment.py results
