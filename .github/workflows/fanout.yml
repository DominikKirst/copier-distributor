name: Fan-out sync

on:
  workflow_call:
    inputs:
      base_sha:
        description: Diff base. Empty → all types.
        required: false
        type: string
        default: ""
      dry_run:
        required: true
        type: boolean
      execute_gh:
        required: false
        type: boolean
        default: false

jobs:
  read:
    runs-on: ubuntu-24.04
    outputs:
      config: ${{ steps.list.outputs.config }}
      lib: ${{ steps.list.outputs.lib }}
      deployable: ${{ steps.list.outputs.deployable }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: types
        run: |
          if [ -z "${{ inputs.base_sha }}" ]; then
            echo "types=config,lib,deployable" >> "$GITHUB_OUTPUT"
            echo "no base sha; all types"
            exit 0
          fi
          types=$(python3 scripts/affected_types.py "${{ inputs.base_sha }}" "${{ github.sha }}")
          echo "types=$types" >> "$GITHUB_OUTPUT"
          echo "affected types: ${types:-<none>}"

      - id: list
        run: python3 scripts/list_targets.py "${{ steps.types.outputs.types }}"

  config:
    needs: read
    if: needs.read.outputs.config != '[]'
    name: ${{ inputs.dry_run && format('{0} (dry-run)', matrix.repo) || format('{0} sync', matrix.repo) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.read.outputs.config) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sync
        with:
          repo: ${{ matrix.repo }}
          url: ${{ matrix.url }}
          branch: ${{ matrix.branch }}
          type: config
          slack: ${{ matrix.slack }}
          vcs_ref: ${{ github.sha }}
          dry_run: ${{ inputs.dry_run }}
          execute_gh: ${{ inputs.execute_gh }}
          use_pr_integration: ${{ matrix.use_pr_integration }}

  lib:
    needs: read
    if: needs.read.outputs.lib != '[]'
    name: ${{ inputs.dry_run && format('{0} (dry-run)', matrix.repo) || format('{0} sync', matrix.repo) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.read.outputs.lib) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sync
        with:
          repo: ${{ matrix.repo }}
          url: ${{ matrix.url }}
          branch: ${{ matrix.branch }}
          type: lib
          slack: ${{ matrix.slack }}
          vcs_ref: ${{ github.sha }}
          dry_run: ${{ inputs.dry_run }}
          execute_gh: ${{ inputs.execute_gh }}
          use_pr_integration: ${{ matrix.use_pr_integration }}

  deployable:
    needs: read
    if: needs.read.outputs.deployable != '[]'
    name: ${{ inputs.dry_run && format('{0} (dry-run)', matrix.repo) || format('{0} sync', matrix.repo) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.read.outputs.deployable) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sync
        with:
          repo: ${{ matrix.repo }}
          url: ${{ matrix.url }}
          branch: ${{ matrix.branch }}
          type: deployable
          slack: ${{ matrix.slack }}
          vcs_ref: ${{ github.sha }}
          dry_run: ${{ inputs.dry_run }}
          execute_gh: ${{ inputs.execute_gh }}
          use_pr_integration: ${{ matrix.use_pr_integration }}
