name: Sync
description: Fan-out copier/git/gh via GitHub App. Slack is always demo.

inputs:
  repo:
    required: true
  url:
    required: true
  branch:
    required: true
  type:
    required: true
  slack:
    required: true
  vcs_ref:
    required: true
  dry_run:
    required: true
  sync_type:
    required: false
    default: "push"
  automerge:
    required: false
    default: "false"
  label:
    required: false
    default: ""
  app_id:
    required: false
    default: ""
  app_private_key:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - if: inputs.sync_type == 'event'
      uses: actions/create-github-app-token@v2
      id: app-token-event
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        permission-actions: write
        permission-contents: read

    - if: inputs.sync_type != 'event'
      uses: actions/create-github-app-token@v2
      id: app-token
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ github.repository_owner }}
        permission-contents: write
        permission-pull-requests: write
        permission-workflows: write

    - run: bash "${{ github.action_path }}/sync.sh"
      shell: bash
      env:
        REPO: ${{ inputs.repo }}
        URL: ${{ inputs.url }}
        BRANCH: ${{ inputs.branch }}
        TYPE: ${{ inputs.type }}
        SLACK: ${{ inputs.slack }}
        VCS_REF: ${{ inputs.vcs_ref }}
        DRY_RUN: ${{ inputs.dry_run }}
        SYNC_TYPE: ${{ inputs.sync_type }}
        AUTOMERGE: ${{ inputs.automerge }}
        LABEL: ${{ inputs.label }}
        GH_TOKEN: ${{ steps.app-token-event.outputs.token || steps.app-token.outputs.token }}
        RESULT_FILE: ${{ github.workspace }}/sync-result-${{ inputs.label }}.json

    - if: ${{ always() && inputs.dry_run == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: sync-result-${{ inputs.label }}
        path: ${{ github.workspace }}/sync-result-${{ inputs.label }}.json
        if-no-files-found: ignore
