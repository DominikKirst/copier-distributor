_subdirectory: "template/{{ type }}"
_answers_file: .copier-answers.yml

_envops:
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

_exclude:
  - copier.yaml
  - copier.yml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  - _shared

_tasks:
  - "bash -c 'if [ -d {{ type }} ]; then cp -a {{ type }}/. .; rm -rf {{ type }}; fi'"

type:
  type: str
  help: "What kind of repo is this?"
  choices:
    Config: config
    Library: lib
    Deployable: deployable
