name: Template sync

on:
  workflow_dispatch:
    inputs:
      vcs_ref:
        description: Template git ref
        required: true
        type: string
      dry_run:
        description: Apply copier but do not commit or push
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VCS_REF: ${{ inputs.vcs_ref }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.repository }}
        run: |
          python3 -m pip install --user --quiet 'copier>=9'
          export PATH="${HOME}/.local/bin:${PATH}"
          git config user.name "copier-distributor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          copier update --trust --defaults --skip-answered --vcs-ref "${VCS_REF}"
          git add -A
          echo "=== git status ==="
          git status --short
          echo "=== git diff ==="
          git diff --cached
          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry_run: not committing or pushing"
            exit 0
          fi
          git commit -m "chore: template sync" || true
          git push
